name: CI

on:
  push: {}

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Mount bazel cache
      uses: actions/cache@v4
      with:
        path: "/home/runner/.cache/bazel"
        key: bazel

    - name: Install bazelisk
      run: |
        curl -LO "https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64"
        mkdir -p "${GITHUB_WORKSPACE}/bin/"
        mv bazelisk-linux-amd64 "${GITHUB_WORKSPACE}/bin/bazel"
        chmod +x "${GITHUB_WORKSPACE}/bin/bazel"

    - name: Dump resolved pnpm-lock.yaml (debug)
      run: |
        "${GITHUB_WORKSPACE}/bin/bazel" build //bookmarker/client/src:bundle || true
        OUTPUT_BASE=$("${GITHUB_WORKSPACE}/bin/bazel" info output_base)
        find "$OUTPUT_BASE/external" -maxdepth 2 -iname "pnpm-lock.yaml" -exec echo {} \; -exec cat {} \;

    - name: Test
      run: |
        "${GITHUB_WORKSPACE}/bin/bazel" test //...

    - name: Build
      run: |
        "${GITHUB_WORKSPACE}/bin/bazel" build //...

